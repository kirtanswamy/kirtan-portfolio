name: Add approved graphite portrait
on:
  push:
    branches:
      - feature/editorial-world-rebuild
    paths:
      - .github/workflows/add-graphite-portrait.yml
permissions:
  contents: write
jobs:
  add-portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editorial-world-rebuild
      - name: Download the original high-resolution portrait from main
        run: |
          mkdir -p public/images
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/kirtanswamy/kirtan-portfolio/main/public/kirtan-graphite-sketch-final.webp' \
            -o public/images/kirtan-notebook-portrait.webp
          file public/images/kirtan-notebook-portrait.webp
          file public/images/kirtan-notebook-portrait.webp | grep -E '1159x1356|Web/P image'
          test -s public/images/kirtan-notebook-portrait.webp
      - name: Commit portrait asset to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/kirtan-notebook-portrait.webp
          git commit -m "assets: add approved high-resolution graphite portrait"
          git push origin HEAD:feature/editorial-world-rebuild
