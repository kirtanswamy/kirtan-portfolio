name: Add approved graphite portrait
on:
  push:
    branches:
      - feature/editorial-world-rebuild
    paths:
      - .github/workflows/add-graphite-portrait.yml
permissions:
  contents: write
jobs:
  add-portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editorial-world-rebuild
      - name: Download high-resolution approved portrait
        run: |
          curl --fail --location --silent --show-error \
            'https://media.canva.com/v2/image-resize/format:WEBP/height:1356/quality:95/uri:ifs%3A%2F%2FM%2Fef590dd1-a48e-4230-817c-18d50a19b48c/watermark:F/width:1159?csig=AAAAAAAAAAAAAAAAAAAAAPvmscg6UZjJP2wJG0PkSTE4YLP7kDpoXB33pmi4QtkE&exp=1795537134&osig=AAAAAAAAAAAAAAAAAAAAALRqj6sF5i0UoJCeJtohLu5I9GasRh8Pd6zRWYiGkCav&signer=media-rpc&token=AAIAAU0AJGVmNTkwZGQxLWE0OGUtNDIzMC04MTdjLTE4ZDUwYTE5YjQ4YwAAAAABog5aYbDqds2HU12176qdZ8wMRSopbK3-Jint5OSXA0sFoUDI4A&x-canva-quality=thumbnail' \
            -o public/images/kirtan-notebook-portrait.webp
          file public/images/kirtan-notebook-portrait.webp
          python - <<'PY'
          from PIL import Image
          p = "public/images/kirtan-notebook-portrait.webp"
          im = Image.open(p)
          assert im.format == "WEBP", im.format
          assert im.width >= 1000 and im.height >= 1200, im.size
          print("Verified portrait dimensions:", im.size)
          PY
      - name: Commit portrait asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/kirtan-notebook-portrait.webp
          git commit -m "assets: add approved high-resolution graphite portrait"
          git push origin HEAD:feature/editorial-world-rebuild
